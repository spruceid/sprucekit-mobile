version: 2

# The SpruceID git dependencies (ssi, isomdl, openid4vp, oid4vci and the
# others pinned by branch or rev in rust/Cargo.toml) are left out: they move
# together with the upstream backport branches, by hand.
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "ssi*"
      - dependency-name: "did-*"
      - dependency-name: isomdl
      - dependency-name: openid4vp
      - dependency-name: openid4vp-frontend
      - dependency-name: oid4vci
      - dependency-name: cose-rs
      - dependency-name: cbor-ld
      - dependency-name: vcalm-rs
      - dependency-name: w3c-vc-barcodes
      - dependency-name: josekit
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]

  - package-ecosystem: pub
    directories:
      - /sprucekit_mobile
      - /sprucekit_mobile/example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
