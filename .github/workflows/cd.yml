name: cd

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag in SemVer format"
        required: true
        type: string

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate main branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "CD must run from '${{ github.event.repository.default_branch }}', not '${{ github.ref_name }}'"
          exit 1
      - name: Validate tag
        run: |
          echo "${{ github.event.inputs.version }}" | grep -P '^[0-9]+\.[0-9]+\.[0-9]+'
      - name: Check tag does not already exist
        run: |
          if git ls-remote --tags origin "refs/tags/${{ github.event.inputs.version }}" | grep -q .; then
            echo "Tag ${{ github.event.inputs.version }} already exists"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    needs: validation
    defaults:
      run:
        working-directory: ./android
    permissions:
      contents: read
    # Two CD runs at the same time would each rewrite maven-metadata.xml and lose a version.
    concurrency: publish-android
    # The R2 credentials are set only on the rclone steps, not on the Gradle build.
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # The token is scoped to the bucket and cannot create it.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: spruceid-maven
      MAVEN_URL: https://maven.spruceid.com
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: "rust -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: "18"
          distribution: "temurin"
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_KEY }}

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Populate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      # Builds the libraries the AAR ships (stripped) and zips their unstripped
      # copies; the publish step below reuses that build.
      - name: Zip native debug symbols
        run: ./gradlew :MobileSdkRs:zipNativeSymbols
        env:
          VERSION: ${{ github.event.inputs.version }}
      # The AAR's libraries must be stripped and carry the build ID of their copy
      # in the zip, or crash reporters can't pair them.
      - name: Check native libraries against their symbols
        run: |
          ls MobileSdkRs/build/rust/symbols/*/libmobile_sdk_rs.so
          for symbols in MobileSdkRs/build/rust/symbols/*/libmobile_sdk_rs.so; do
            abi=$(basename "$(dirname "$symbols")")
            packaged="MobileSdkRs/src/main/jniLibs/$abi/libmobile_sdk_rs.so"
            id=$(readelf -n "$packaged" | awk '/Build ID/ {print $3}')
            if [ -z "$id" ] || [ "$id" != "$(readelf -n "$symbols" | awk '/Build ID/ {print $3}')" ]; then
              echo "$abi: build ID missing or different between the AAR and symbols libraries"
              exit 1
            fi
            if readelf -S -W "$packaged" | grep -q '\.symtab'; then
              echo "$abi: the AAR library is not stripped"
              exit 1
            fi
            if ! readelf -S -W "$symbols" | grep -q '\.symtab'; then
              echo "$abi: the symbols library has no symbol table"
              exit 1
            fi
            echo "$abi: stripped, build ID $id"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-symbols
          path: android/MobileSdkRs/build/distributions/MobileSdkRs-native-symbols-${{ github.event.inputs.version }}.zip
          if-no-files-found: error

      # Gradle adds the new version to the existing maven-metadata.xml. Without
      # this step, the upload would replace the version list with only the new version.
      - name: Download existing Maven metadata
        run: rclone copy "r2:$R2_BUCKET" build/r2-staging --include "**/maven-metadata.xml*"
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Publish to the staging repository
        run: ./gradlew publishReleasePublicationToR2StagingRepository
        env:
          VERSION: ${{ github.event.inputs.version }}

      # --immutable makes rclone fail instead of overwriting a published file.
      - name: Upload version files to R2
        run: rclone copy build/r2-staging "r2:$R2_BUCKET" --exclude "**/maven-metadata.xml*" --immutable
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Metadata is uploaded last so consumers never see a partially uploaded version.
      - name: Upload Maven metadata to R2
        run: rclone copy build/r2-staging "r2:$R2_BUCKET" --include "**/maven-metadata.xml*"
        env:
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Check the published artifacts
        run: |
          for path in com/spruceid/mobile/sdk/mobilesdk/$VERSION/mobilesdk-$VERSION \
                      com/spruceid/mobile/sdk/rs/mobilesdkrs/$VERSION/mobilesdkrs-$VERSION; do
            for ext in pom aar aar.asc; do
              curl -fsSI "$MAVEN_URL/$path.$ext" > /dev/null
            done
          done
        env:
          VERSION: ${{ github.event.inputs.version }}

  ios:
    runs-on: macos-latest
    needs: validation
    outputs:
      checksum: ${{ steps.checksum.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios"
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: "rust -> target"

      # uniffi library-mode bindgen + xcodebuild — see rust/build-ios.sh
      - name: Generate Swift package
        run: ./build-ios.sh
        working-directory: rust

      - name: Compress XCFramework
        run: zip -9 -r MobileSdkRsFFI.xcframework.zip rust/MobileSdkRs/MobileSdkRsFFI.xcframework

      - name: Compute checksum
        id: checksum
        run: echo "value=$(swift package compute-checksum MobileSdkRsFFI.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: rust-xcframework
          path: MobileSdkRsFFI.xcframework.zip

  release:
    runs-on: macos-latest
    needs: [android, ios]
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.MONOREPO_GH_APP_ID }}
          private-key: ${{ secrets.MONOREPO_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            sprucekit-mobile
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      # If this fails due to a new commit on the main branch, it's a feature not a bug!
      # This way, there will be no confusion around what was included in the release.
      - name: Ensure main has not moved since dispatch
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "main advanced since dispatch (HEAD=$(git rev-parse HEAD), dispatch=${{ github.sha }})"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: rust-xcframework

      - uses: actions/download-artifact@v8
        with:
          name: android-native-symbols

      - name: Update Swift Package definition
        run: |
          sed -i '' 's/binaryTarget.*/binaryTarget(name: "MobileSdkRsFFI", url: "https:\/\/github.com\/spruceid\/sprucekit-mobile\/releases\/download\/${{ github.event.inputs.version }}\/MobileSdkRsFFI.xcframework.zip", checksum: "${{ needs.ios.outputs.checksum }}"),/' Package.swift

      - name: Update CocoaPods podspecs
        run: |
          sed -i '' "s/spec.version.*=.*/spec.version      = '${{ github.event.inputs.version }}'/" SpruceIDMobileSdkRsRustFramework.podspec
          sed -i '' "s/spec.version.*=.*/spec.version      = '${{ github.event.inputs.version }}'/" SpruceIDMobileSdkRs.podspec
          sed -i '' "s/spec.version.*=.*/spec.version          = '${{ github.event.inputs.version }}'/" SpruceIDMobileSdk.podspec
          sed -i '' "s/spec.dependency 'SpruceIDMobileSdkRs'.*/spec.dependency 'SpruceIDMobileSdkRs', '~> ${{ github.event.inputs.version }}'/" SpruceIDMobileSdk.podspec

      - name: Update Flutter plugin versions
        run: |
          sed -i '' "s/com.spruceid.mobile.sdk:mobilesdk:[0-9.]*/com.spruceid.mobile.sdk:mobilesdk:${{ github.event.inputs.version }}/" sprucekit_mobile/android/build.gradle
          sed -i '' "s/com.spruceid.mobile.sdk.rs:mobilesdkrs:[0-9.]*/com.spruceid.mobile.sdk.rs:mobilesdkrs:${{ github.event.inputs.version }}/" sprucekit_mobile/android/build.gradle
          sed -i '' "s/^version:.*/version: ${{ github.event.inputs.version }}/" sprucekit_mobile/pubspec.yaml
          sed -i '' "s/s.version.*/s.version          = '${{ github.event.inputs.version }}'/" sprucekit_mobile/ios/sprucekit_mobile.podspec
          sed -i '' "s/s.dependency 'SpruceIDMobileSdk'.*/s.dependency 'SpruceIDMobileSdk', '~> ${{ github.event.inputs.version }}'/" sprucekit_mobile/ios/sprucekit_mobile.podspec
          sed -i '' "s/exact: \"[0-9.]*\"/exact: \"${{ github.event.inputs.version }}\"/" sprucekit_mobile/ios/sprucekit_mobile/Package.swift

      # pub.dev shows the CHANGELOG entry for each version. The first entry in
      # the file is the release before this one.
      - name: Add Flutter plugin CHANGELOG entry
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          P=$(sed -n 's/^## \([0-9][0-9.]*\)$/\1/p' sprucekit_mobile/CHANGELOG.md | head -1)
          P="$P" perl -0pi -e 's/\n## /\n## $ENV{V}\n\n- [Changes since $ENV{P}](https:\/\/github.com\/spruceid\/sprucekit-mobile\/compare\/$ENV{P}...$ENV{V})\n\n## /' sprucekit_mobile/CHANGELOG.md

      - name: Push changes and tag
        id: commit
        run: |
          git add Package.swift SpruceIDMobileSdk.podspec SpruceIDMobileSdkRs.podspec SpruceIDMobileSdkRsRustFramework.podspec sprucekit_mobile/
          git commit -m "Release ${{ github.event.inputs.version }}"
          git push
          git tag ${{ github.event.inputs.version }} -m "${{ github.event.inputs.version }}"
          git push --tags

      - name: Create release and attach XCFramework and Android native symbols
        uses: ncipollo/release-action@v1
        with:
          artifacts: "MobileSdkRsFFI.xcframework.zip,MobileSdkRs-native-symbols-${{ github.event.inputs.version }}.zip"
          tag: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}

      - uses: webfactory/ssh-agent@v0.10.0
        if: steps.commit.outcome == 'success'
        with:
          ssh-private-key: ${{ secrets.COCOAPODS_SPECS_DEPLOY_KEY }}

      - name: Publish podspecs to private Specs repo
        if: steps.commit.outcome == 'success'
        run: |
          pod repo add spruce-specs git@github.com:spruceid/cocoapods-specs.git
          pod repo push spruce-specs SpruceIDMobileSdkRsRustFramework.podspec --allow-warnings --skip-import-validation
          pod repo push spruce-specs SpruceIDMobileSdkRs.podspec --allow-warnings --skip-import-validation
          pod repo push spruce-specs SpruceIDMobileSdk.podspec --allow-warnings --skip-import-validation

      - name: Revert Package.swift for local development
        if: ${{ !cancelled() && steps.commit.outcome == 'success' }}
        run: |
          sed -i '' 's/binaryTarget.*/binaryTarget(name: "MobileSdkRsFFI", path: "rust\/MobileSdkRs\/MobileSdkRsFFI.xcframework"),/' Package.swift
          git add Package.swift
          git commit -m "Revert Package.swift for local development"
          git push
