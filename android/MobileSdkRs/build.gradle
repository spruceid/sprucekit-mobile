plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.nmcp'
    id("org.jetbrains.kotlin.plugin.compose") version "2.1.0"
    id 'app.cash.licensee'
}

// Full allowlist is in rust/deny.toml. Only licenses actually present in this
// module's dependencies are listed so licensee flags any new license type.
licensee {
    allow('Apache-2.0')
}

android {
    namespace 'com.spruceid.mobile.sdk.rs'
    compileSdk 35

    defaultConfig {
        minSdk 24

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    ndkVersion '29.0.13599879 rc2'

    // 32-bit x86 is no longer built; keep a stale jniLibs/x86 from an older
    // checkout out of the AAR.
    packaging {
        jniLibs {
            excludes += ['lib/x86/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation("androidx.compose.runtime:runtime:1.8.3")

    implementation "net.java.dev.jna:jna:5.19.1@aar"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
}

tasks.register('buildCargoNdk', Exec) {
    def rustTargetAbis = [
            "arm"   : "armeabi-v7a",
            "arm64" : "arm64-v8a",
            "x86_64": "x86_64",
    ]
    // `-Prust-target=<id>` restricts the build to a single target.
    def rustTarget = findProperty("rust-target")
    def abis = rustTargetAbis.values()
    if (rustTarget != null) {
        if (rustTarget.toString() == "x86") {
            throw new GradleException("rust-target 'x86' (32-bit) is no longer built; use 'x86_64' for emulators")
        }
        def abi = rustTargetAbis[rustTarget.toString()]
        if (abi == null) {
            throw new GradleException("Unknown rust-target '${rustTarget}', expected one of ${rustTargetAbis.keySet()}")
        }
        abis = [abi]
    }

    dependsOn(tasks.named("bindGen"))
    onlyIf { rustUpdated(name) || !nativeLibsComplete(abis) }
    doLast {
        if (copyNativeLibs(abis)) {
            onSuccess(name)
        } else {
            // Unstripped fallback: run again next time, in case llvm-strip shows up.
            markerFile(name).delete()
        }
    }

    workingDir rootDir.toPath().toString() + "/../rust"
    // No `-o`: copyNativeLibs takes the libraries from Cargo's target dir, so
    // the unstripped copies stay unstripped whatever cargo-ndk version runs
    // (3.x strips what it copies to `-o`, 4.x doesn't).
    commandLine(["cargo", "ndk"] + abis.collectMany { ["-t", it] } + [
            "--platform", android.defaultConfig.minSdk.toString(),
            // `rustc --crate-type cdylib` rather than `build`: Cargo skips LTO for a
            // crate that also emits an rlib (mobile-sdk-rs keeps one for its
            // integration tests), so the release profile's LTO only applies when the
            // cdylib is the sole output.
            "rustc", "--lib", "--crate-type", "cdylib", "--release",
    ] + (Os.isFamily(Os.FAMILY_WINDOWS) ? [] : [
            // Hide the UNIFFI_META_* statics from the .so exports so the linker drops
            // them. See rust/scripts/android-version-script.sh. Windows hosts skip this
            // because bindGen doesn't generate the script there.
            "--",
            "-C", "link-arg=-Wl,--version-script=${androidVersionScript()}",
            "-C", "link-arg=-Wl,--undefined-version",
    ]))

    def localProperties = rootProject.file("local.properties")
    if (localProperties.exists()) {
        def properties = new Properties()
        localProperties.withInputStream { properties.load(it) }
        def ndkDir = properties.getProperty("ndk.dir")
        if (ndkDir != null) {
            environment "ANDROID_NDK_HOME", ndkDir
        }
    }
}

def markerFile(taskName) {
    return file("${getLayout().buildDirectory.get()}/.${taskName}LastRun")
}

// Linker version script for the Android .so, written by bindGen.
def androidVersionScript() {
    return file("${getLayout().buildDirectory.get()}/rust/android-exports.map")
}

def rustUpdated(taskName) {
    def srcTree = fileTree("../../rust/src") + fileTree("../../rust/mobile-toolkit/src")
    def manifest = files(
            "../../rust/Cargo.toml",
            "../../rust/Cargo.lock",
            "../../rust/.cargo/config.toml",
            "../../rust/uniffi.toml",
            "../../rust/mobile-toolkit/Cargo.toml",
            "../../rust/mobile-toolkit/Cargo.lock",
            "../../rust/mobile-toolkit/uniffi.toml",
            "../../rust/scripts/android-version-script.sh",
            "../../rust/scripts/export-prefixes.sh",
    )
    def markerFile = markerFile(taskName)

    if (!markerFile.exists()) {
        return true
    }

    if (taskName.startsWith("buildCargoNdk")
            && fileTree(dir: "src/main/jniLibs", include: "**/*.so").isEmpty()) {
        return true
    }
    if (taskName == "bindGen"
            && (fileTree(dir: "src/main/java", include: "**/mobile_sdk_rs.kt").isEmpty()
                    || fileTree(dir: "src/main/java", include: "**/mobile_toolkit.kt").isEmpty()
                    || (!Os.isFamily(Os.FAMILY_WINDOWS) && !androidVersionScript().exists()))) {
        return true
    }

    def lastRun = Long.parseLong(markerFile.text)

    // bindGen rewrites the version script; relink when it changed.
    if (taskName.startsWith("buildCargoNdk")) {
        manifest += files(androidVersionScript())
    }

    def changed = (srcTree.files + manifest.files).any {
        getLogger().info("File: ${it.name}, last modified: ${it.lastModified()}, last run: $lastRun")
        it.lastModified() > lastRun
    }

    return changed
}

def onSuccess(taskName) {
    def markerFile = markerFile(taskName)
    if (!markerFile.exists()) {
        markerFile.parentFile.mkdirs()
    }
    markerFile.text = "${System.currentTimeMillis()}"
}

// Unstripped libraries, `<abi>/libmobile_sdk_rs.so`, for crash symbolication.
def nativeSymbolsDir() {
    return file("${getLayout().buildDirectory.get()}/rust/symbols")
}

def nativeLib(dir, abi) {
    return new File(dir, "${abi}/libmobile_sdk_rs.so")
}

// buildCargoNdk reruns when either copy of a library is missing.
def nativeLibsComplete(abis) {
    return abis.every {
        nativeLib(file("src/main/jniLibs"), it).exists() && nativeLib(nativeSymbolsDir(), it).exists()
    }
}

// The NDK's llvm-strip, looked up the way cargo-ndk finds the NDK: ndk.dir in
// local.properties (passed on as ANDROID_NDK_HOME), the ANDROID_NDK_* variables,
// then the newest NDK in the SDK. Null if there's none.
def findLlvmStrip() {
    def localProperties = rootProject.file("local.properties")
    def properties = new Properties()
    if (localProperties.exists()) {
        localProperties.withInputStream { properties.load(it) }
    }
    def ndkDirs = ([properties.getProperty("ndk.dir")]
            + ["ANDROID_NDK_HOME", "ANDROID_NDK_ROOT", "ANDROID_NDK_PATH", "NDK_HOME"].collect { System.getenv(it) })
            .findAll { it != null }
            .collect { new File(it) }
    // A variable may also point at a folder of NDK versions, like <sdk>/ndk.
    def newestNdk = { File parent ->
        def version = { File dir -> dir.name.tokenize(".").collect { it.isInteger() ? it.toInteger() : 0 } }
        parent.listFiles()?.findAll { it.isDirectory() }?.max { a, b ->
            def (va, vb) = [version(a), version(b)]
            [va, vb].transpose().collect { it[0] <=> it[1] }.find { it != 0 } ?: va.size() <=> vb.size()
        }
    }
    def ndks = ndkDirs.collectMany { [it, newestNdk(it)] } + [newestNdk(new File(android.sdkDirectory, "ndk"))]
    // toolchains/llvm/prebuilt/<host>/bin, <host> being darwin-x86_64, linux-x86_64 or windows-x86_64.
    return ndks.findAll { it != null }
            .collectMany { new File(it, "toolchains/llvm/prebuilt").listFiles()?.toList() ?: [] }
            .collectMany { [new File(it, "bin/llvm-strip"), new File(it, "bin/llvm-strip.exe")] }
            .find { it.isFile() }
}

// Takes each ABI's library from Cargo's target dir: the unstripped file goes to
// nativeSymbolsDir() (zipped by zipNativeSymbols), a stripped copy to jniLibs (packaged
// in the AAR). `--strip-all` drops .symtab/.strtab; .dynsym (what JNA looks up) and
// the build ID note stay, so crash reporters match the two files. Returns false when
// it had to package unstripped libraries.
def copyNativeLibs(abis) {
    def rustTriples = [
            "armeabi-v7a": "armv7-linux-androideabi",
            "arm64-v8a"  : "aarch64-linux-android",
            "x86"        : "i686-linux-android",
            "x86_64"     : "x86_64-linux-android",
    ]
    // Cargo's own answer, so CARGO_TARGET_DIR and build.target-dir are honoured.
    def metadata = ["cargo", "metadata", "--format-version", "1", "--no-deps"]
            .execute(null, new File(rootDir, "../rust"))
    def metadataOut = new StringBuilder()
    metadata.waitForProcessOutput(metadataOut, System.err)
    if (metadata.exitValue() != 0) {
        throw new GradleException("cargo metadata failed")
    }
    def targetDir = new File(new groovy.json.JsonSlurper().parseText(metadataOut.toString()).target_directory)
    def jniLibs = file("src/main/jniLibs")
    def strip = findLlvmStrip()
    if (strip == null) {
        def message = "llvm-strip not found: no NDK in ndk.dir, ANDROID_NDK_HOME or the SDK"
        if (System.getenv("CI") != null) {
            throw new GradleException(message)
        }
        logger.warn("warning: ${message}; the AAR gets unstripped libraries")
    }

    // Start clean, so jniLibs and the symbols never mix libraries from different builds.
    delete(nativeSymbolsDir(), fileTree(jniLibs).matching { include("*/libmobile_sdk_rs.so") })
    abis.each { abi ->
        def built = new File(targetDir, "${rustTriples[abi]}/release/libmobile_sdk_rs.so")
        if (!built.exists()) {
            throw new GradleException("${built} not found after cargo ndk")
        }
        def symbols = nativeLib(nativeSymbolsDir(), abi)
        def packaged = nativeLib(jniLibs, abi)
        symbols.parentFile.mkdirs()
        packaged.parentFile.mkdirs()
        java.nio.file.Files.copy(built.toPath(), symbols.toPath())
        if (strip != null) {
            def process = [strip.path, "--strip-all", "-o", packaged.path, symbols.path].execute()
            process.waitForProcessOutput(System.out, System.err)
            if (process.exitValue() != 0) {
                throw new GradleException("${strip} failed on ${symbols}")
            }
        } else {
            java.nio.file.Files.copy(built.toPath(), packaged.toPath())
        }
    }
    return strip != null
}

// Zips the unstripped libraries as `<abi>/libmobile_sdk_rs.so`, the layout Play
// Console, Crashlytics and Sentry take. cd.yml attaches it to the GitHub release.
tasks.register('zipNativeSymbols', Zip) {
    dependsOn(tasks.named("buildCargoNdk"))
    from(nativeSymbolsDir())
    include("*/libmobile_sdk_rs.so")
    archiveFileName = "MobileSdkRs-native-symbols-${System.getenv("VERSION") ?: "dev"}.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")
}

afterEvaluate {
    // The `cargoBuild` task isn't available until after evaluation.
    android.libraryVariants.configureEach { variant ->
        def productFlavor = ""
        variant.productFlavors.each {
            productFlavor += "${it.name.capitalize()}"
        }
        def buildType = "${variant.buildType.name.capitalize()}"

        tasks.named("compileReleaseKotlin") {
            it.dependsOn(tasks.named("bindGen"))
        }

        tasks.named("compileDebugKotlin") {
            it.mustRunAfter(tasks.named("bindGen"))
        }

        tasks.named("generate${productFlavor}${buildType}Assets") {
            it.dependsOn(tasks.named("buildCargoNdk"))
        }

        tasks.named("merge${productFlavor}${buildType}JniLibFolders") {
            it.dependsOn(tasks.named("buildCargoNdk"))
        }
    }

    tasks.named("bindGen").configure {
        def name = it.name
        it.onlyIf { rustUpdated(name) }
        it.doLast { onSuccess(name) }
    }
}

import org.apache.tools.ant.taskdefs.condition.Os
tasks.register('bindGen', Exec) {
    def outDir = "${projectDir}/src/main/java"
    workingDir rootDir.toPath().toString() + "/../rust"
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine("cmd", "/c",
                "cargo build && " + "cargo run -p uniffi-bindgen generate --library target\\debug\\libmobile_sdk_rs.dll " + "--language kotlin " + "--out-dir " + outDir.replace('/', '\\'))
    } else {
        def extension
        if (Os.isFamily(Os.FAMILY_MAC)) {
            extension = "dylib"
        } else {
            extension = "so"
        }
        commandLine("sh", "-c",
                """\
                cargo build && \
                cargo run -p uniffi-bindgen generate \
                --library target/debug/libmobile_sdk_rs.$extension \
                --language kotlin \
                --out-dir $outDir \
                --no-format && \
                sh scripts/android-version-script.sh \
                target/debug/libmobile_sdk_rs.$extension \
                "${androidVersionScript()}"
                """)
    }
}

publishing {
    // Package is tied to spruceid/mobile-sdk-rs, and it was unused so ignoring it for now
    // repositories {
    //     maven {
    //         name = "GitHubPackages"
    //         url = "https://maven.pkg.github.com/spruceid/sprucekit-mobile"
    //         credentials {
    //             username = System.getenv("GITHUB_ACTOR")
    //             password = System.getenv("GITHUB_TOKEN")
    //         }
    //     }
    // }
    publications {
        debug(MavenPublication) {
            groupId = 'com.spruceid.mobile.sdk.rs'
            artifactId = "mobilesdkrs"
            version = System.getenv("VERSION")

            afterEvaluate {
                from components.release
            }
        }
        release(MavenPublication) {
            groupId = 'com.spruceid.mobile.sdk.rs'
            artifactId = "mobilesdkrs"
            version = System.getenv("VERSION")

            afterEvaluate {
                from components.release
            }

            pom {
                packaging = "aar"
                name.set("mobilesdkrs")
                description.set("Rust layer for SpruceID Mobile SDK")
                url.set("https://github.com/spruceid/sprucekit-mobile")
                licenses {
                    license {
                        name.set("MIT License")
                        url.set("https://opensource.org/license/mit/")
                    }
                    license {
                        name.set("Apache License, Version 2.0")
                        url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                    }
                }
                developers {
                    developer {
                        name.set("Spruce Systems, Inc.")
                        email.set("hello@spruceid.com")
                    }
                }
                scm {
                    url.set(pom.url.get())
                    connection.set("scm:git:${url.get()}.git")
                    developerConnection.set("scm:git:${url.get()}.git")
                }
            }
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.release
}

