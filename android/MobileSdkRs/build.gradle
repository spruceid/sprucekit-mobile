plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.nmcp'
    id("org.jetbrains.kotlin.plugin.compose") version "2.1.0"
    id 'app.cash.licensee'
}

// Full allowlist is in rust/deny.toml. Only licenses actually present in this
// module's dependencies are listed so licensee flags any new license type.
licensee {
    allow('Apache-2.0')
}

android {
    namespace 'com.spruceid.mobile.sdk.rs'
    compileSdk 35

    defaultConfig {
        minSdk 24

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
    ndkVersion '29.0.13599879 rc2'

    // 32-bit x86 is no longer built; keep a stale jniLibs/x86 from an older
    // checkout out of the AAR.
    packaging {
        jniLibs {
            excludes += ['lib/x86/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation("androidx.compose.runtime:runtime:1.8.3")

    implementation "net.java.dev.jna:jna:5.19.1@aar"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
}

tasks.register('buildCargoNdk', Exec) {
    def rustTargetAbis = [
            "arm"   : "armeabi-v7a",
            "arm64" : "arm64-v8a",
            "x86_64": "x86_64",
    ]
    // `-Prust-target=<id>` restricts the build to a single target.
    def rustTarget = findProperty("rust-target")
    def abis = rustTargetAbis.values()
    if (rustTarget != null) {
        if (rustTarget.toString() == "x86") {
            throw new GradleException("rust-target 'x86' (32-bit) is no longer built; use 'x86_64' for emulators")
        }
        def abi = rustTargetAbis[rustTarget.toString()]
        if (abi == null) {
            throw new GradleException("Unknown rust-target '${rustTarget}', expected one of ${rustTargetAbis.keySet()}")
        }
        abis = [abi]
    }

    dependsOn(tasks.named("bindGen"))
    onlyIf { rustUpdated(name) }
    doLast { onSuccess(name) }

    workingDir rootDir.toPath().toString() + "/../rust"
    commandLine(["cargo", "ndk"] + abis.collectMany { ["-t", it] } + [
            "--platform", android.defaultConfig.minSdk.toString(),
            "-o", "${projectDir}/src/main/jniLibs",
            // `rustc --crate-type cdylib` rather than `build`: Cargo skips LTO for a
            // crate that also emits an rlib (mobile-sdk-rs keeps one for its
            // integration tests), so the release profile's LTO only applies when the
            // cdylib is the sole output.
            "rustc", "--lib", "--crate-type", "cdylib", "--release",
    ])

    def localProperties = rootProject.file("local.properties")
    if (localProperties.exists()) {
        def properties = new Properties()
        localProperties.withInputStream { properties.load(it) }
        def ndkDir = properties.getProperty("ndk.dir")
        if (ndkDir != null) {
            environment "ANDROID_NDK_HOME", ndkDir
        }
    }
}

def markerFile(taskName) {
    return file("${getLayout().buildDirectory.get()}/.${taskName}LastRun")
}

def rustUpdated(taskName) {
    def srcTree = fileTree("../../rust/src") + fileTree("../../rust/mobile-toolkit/src")
    def manifest = files(
            "../../rust/Cargo.toml",
            "../../rust/Cargo.lock",
            "../../rust/uniffi.toml",
            "../../rust/mobile-toolkit/Cargo.toml",
            "../../rust/mobile-toolkit/Cargo.lock",
            "../../rust/mobile-toolkit/uniffi.toml",
    )
    def markerFile = markerFile(taskName)

    if (!markerFile.exists()) {
        return true
    }

    if (taskName.startsWith("buildCargoNdk")
            && fileTree(dir: "src/main/jniLibs", include: "**/*.so").isEmpty()) {
        return true
    }
    if (taskName == "bindGen"
            && (fileTree(dir: "src/main/java", include: "**/mobile_sdk_rs.kt").isEmpty()
                    || fileTree(dir: "src/main/java", include: "**/mobile_toolkit.kt").isEmpty())) {
        return true
    }

    def lastRun = Long.parseLong(markerFile.text)

    def changed = (srcTree.files + manifest.files).any {
        getLogger().info("File: ${it.name}, last modified: ${it.lastModified()}, last run: $lastRun")
        it.lastModified() > lastRun
    }

    return changed
}

def onSuccess(taskName) {
    def markerFile = markerFile(taskName)
    if (!markerFile.exists()) {
        markerFile.parentFile.mkdirs()
    }
    markerFile.text = "${System.currentTimeMillis()}"
}

afterEvaluate {
    // The `cargoBuild` task isn't available until after evaluation.
    android.libraryVariants.configureEach { variant ->
        def productFlavor = ""
        variant.productFlavors.each {
            productFlavor += "${it.name.capitalize()}"
        }
        def buildType = "${variant.buildType.name.capitalize()}"

        tasks.named("compileReleaseKotlin") {
            it.dependsOn(tasks.named("bindGen"))
        }

        tasks.named("compileDebugKotlin") {
            it.mustRunAfter(tasks.named("bindGen"))
        }

        tasks.named("generate${productFlavor}${buildType}Assets") {
            it.dependsOn(tasks.named("buildCargoNdk"))
        }

        tasks.named("merge${productFlavor}${buildType}JniLibFolders") {
            it.dependsOn(tasks.named("buildCargoNdk"))
        }
    }

    tasks.named("bindGen").configure {
        def name = it.name
        it.onlyIf { rustUpdated(name) }
        it.doLast { onSuccess(name) }
    }
}

import org.apache.tools.ant.taskdefs.condition.Os
tasks.register('bindGen', Exec) {
    def outDir = "${projectDir}/src/main/java"
    workingDir rootDir.toPath().toString() + "/../rust"
    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
        commandLine("cmd", "/c",
                "cargo build && " + "cargo run -p uniffi-bindgen generate --library target\\debug\\libmobile_sdk_rs.dll " + "--language kotlin " + "--out-dir " + outDir.replace('/', '\\'))
    } else {
        def extension
        if (Os.isFamily(Os.FAMILY_MAC)) {
            extension = "dylib"
        } else {
            extension = "so"
        }
        commandLine("sh", "-c",
                """\
                cargo build && \
                cargo run -p uniffi-bindgen generate \
                --library target/debug/libmobile_sdk_rs.$extension \
                --language kotlin \
                --out-dir $outDir \
                --no-format
                """)
    }
}

publishing {
    // Package is tied to spruceid/mobile-sdk-rs, and it was unused so ignoring it for now
    // repositories {
    //     maven {
    //         name = "GitHubPackages"
    //         url = "https://maven.pkg.github.com/spruceid/sprucekit-mobile"
    //         credentials {
    //             username = System.getenv("GITHUB_ACTOR")
    //             password = System.getenv("GITHUB_TOKEN")
    //         }
    //     }
    // }
    publications {
        debug(MavenPublication) {
            groupId = 'com.spruceid.mobile.sdk.rs'
            artifactId = "mobilesdkrs"
            version = System.getenv("VERSION")

            afterEvaluate {
                from components.release
            }
        }
        release(MavenPublication) {
            groupId = 'com.spruceid.mobile.sdk.rs'
            artifactId = "mobilesdkrs"
            version = System.getenv("VERSION")

            afterEvaluate {
                from components.release
            }

            pom {
                packaging = "aar"
                name.set("mobilesdkrs")
                description.set("Rust layer for SpruceID Mobile SDK")
                url.set("https://github.com/spruceid/sprucekit-mobile")
                licenses {
                    license {
                        name.set("MIT License")
                        url.set("https://opensource.org/license/mit/")
                    }
                    license {
                        name.set("Apache License, Version 2.0")
                        url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                    }
                }
                developers {
                    developer {
                        name.set("Spruce Systems, Inc.")
                        email.set("hello@spruceid.com")
                    }
                }
                scm {
                    url.set(pom.url.get())
                    connection.set("scm:git:${url.get()}.git")
                    developerConnection.set("scm:git:${url.get()}.git")
                }
            }
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.release
}

